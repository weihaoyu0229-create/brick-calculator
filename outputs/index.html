</style></head><body><div class="app"><div class="header"><h1>砖成本计算器</h1><p>填入当前砖参数，自动推算不同高度下的成本</p><div style="display:flex;gap:6px;flex-shrink:0;margin-top:4px"><button style="background:#059669;color:#fff;border:none;border-radius:5px;padding:7px 14px;font-size:13px;cursor:pointer" onclick="sv()">💾 保存参数</button><button style="background:#3b82f6;color:#fff;border:none;border-radius:5px;padding:7px 14px;font-size:13px;cursor:pointer" onclick="tg()">📂 已保存记录</button></div></div><div class="layout"><div class="panel"><div class="panel-title">砖参数</div><div class="form-row"><label>砖品种</label><input type="text" id="brickType" placeholder="如：水泥砖、透水砖…"></div><div class="form-row"><label>长度</label><input type="number" id="length" value="15" step="0.1" min="0.1" inputmode="decimal"><span class="suffix">cm</span></div><div class="form-row"><label>宽度</label><input type="number" id="width" value="30" step="0.1" min="0.1" inputmode="decimal"><span class="suffix">cm</span></div><div class="form-row"><label>高度（1cm=一个厚度）</label><input type="number" id="height" value="10" step="0.1" min="0.1" inputmode="decimal"><span class="suffix">cm</span></div><div class="derived-row"><span class="label">每厘米用料（备注）</span><span class="value" id="densityDisplay">— kg/cm</span></div><div class="form-row"><label>每锅产量</label><input type="number" id="batchQty" value="210" step="1" min="1" inputmode="numeric"><span class="suffix">块</span></div><div class="derived-row" style="margin-bottom:14px"><span><span class="label">单块重量</span> <span class="hint">= 原料合计 ÷ 产量</span></span><span class="value" id="derivedWeight">— kg</span></div><div class="row-label">一托盘</div><div class="pallet-row"><div class="p-item"><label>层数</label><input type="number" id="palletLayers" value="3" step="1" min="1" inputmode="numeric"><span class="suffix" style="font-size:11px">层</span></div><div class="p-item"><label>一层几块砖</label><input type="number" id="bricksPerLayer" value="50" step="1" min="1" inputmode="numeric"><span class="suffix" style="font-size:11px">块</span></div></div><div class="derived-row" style="margin-bottom:14px"><span class="label">合计一托盘</span><span class="value" id="palletQtyDisplay">150 块</span></div><div class="row-label">生成不同高度成本（生产成其他厚度（1cm=一个厚度））</div><div class="form-row"><label>目标高度（目标几个厚）</label><input type="number" id="targetH" value="12" step="0.1" min="0" inputmode="decimal"><span class="suffix">cm（填0则不生成）</span></div><div class="row-label">原材料（每锅用量）</div><div id="materialList"></div><button class="btn-add" id="addMatBtn">+ 添加原料</button><div class="row-label">其他成本</div><div class="form-row"><label>人工(按块)</label><input type="number" id="labor" value="0" step="0.001" min="0" inputmode="decimal"><span class="suffix">元/块</span></div><div class="form-row"><label>人工(按平方)</label><input type="number" id="laborSqm" value="0" step="0.001" min="0" inputmode="decimal"><span class="suffix">元/m²</span></div><div class="row-label" style="margin-top:8px;font-size:11px">运费</div><div class="ship-row"><div class="ship-item"><label>小车运费</label><input type="number" id="smallCost" value="0" step="1" min="0" inputmode="numeric"><span class="suffix" style="font-size:11px">元/车</span></div><div class="ship-item"><label>小车拉托盘</label><input type="number" id="smallPallets" value="0" step="1" min="0" inputmode="numeric"><span class="suffix" style="font-size:11px">托盘/车</span></div></div><div class="ship-info" id="smallInfo">小车运费: — 元/块  |  — 元/m²</div><div class="ship-row"><div class="ship-item"><label>大车运费</label><input type="number" id="bigCost" value="0" step="1" min="0" inputmode="numeric"><span class="suffix" style="font-size:11px">元/车</span></div><div class="ship-item"><label>大车拉托盘</label><input type="number" id="bigPallets" value="0" step="1" min="0" inputmode="numeric"><span class="suffix" style="font-size:11px">托盘/车</span></div></div><div class="ship-info" id="bigInfo">大车运费: — 元/块  |  — 元/m²</div><div class="form-row" style="margin-top:4px"><label>其他</label><input type="number" id="other" value="0" step="0.001" min="0" inputmode="decimal"><span class="suffix">元/块</span></div><div class="save-panel" id="spn"><div style="font-size:12px;font-weight:600;color:#374151;margin-bottom:8px">📂 已保存记录</div><div id="rcl"><div style="color:#9ca3af;font-size:12px;text-align:center;padding:12px 0">暂无保存记录</div></div></div></div><div class="panel"><div class="panel-title">计算结果</div><div id="results"><div class="empty-state">填写左侧参数后自动计算</div></div></div><div class="export-row" id="expBtns" style="display:none">

  if(palletBricks>0)val('\u6BCF\u6258\u76D8\u7816\u6210\u672C('+palletBricks+'\u5757)',(cpbAll*palletBricks).toFixed(2)+' \u5143');
  sep();
  line('\u751F\u6210\u65F6\u95F4: '+new Date().toLocaleString('zh-CN'));
  var a=document.createElement('a');
  a.href=c.toDataURL('image/png');
  a.download='\u7816\u6210\u672C\u56FE_'+(I.brickType.value||'\u672A\u547D\u540D')+'.png';
  a.click();
}
